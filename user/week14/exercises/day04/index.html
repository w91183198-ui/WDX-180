     <script>
const ninetiesToys = [
  {
      name: "Tamagotchi",
      releaseYear: 1996,
      price: 15.99
  },
  {
      name: "Furby",
      releaseYear: 1998,
      price: 29.99
  },
  {
      name: "Super Soaker",
      releaseYear: 1989,
      price: 19.99
  },
  {
      name: "Pogs",
      releaseYear: 1991,
      price: 5.99
  },
  {
      name: "Game Boy",
      releaseYear: 1989,
      price: 89.99
  }
];

function findCheapToys(items = ninetiesToys)
{
    let results = [];
    items.forEach(v => {
        if(v.price < 20)
            results.push(v.name);
    });
    return results;
}

function findCheapToys_MapFilter(items = ninetiesToys)
{
    return items.filter(v => v.price < 20).map(v => v.name);
}

function findCheapToys_Reduce(items = ninetiesToys) 
{
    return items.reduce((results, v) => {
        if(v.price < 20)
            results.push(v.name);
        return results;
    }, []);
}

console.log(findCheapToys());
console.log(findCheapToys_MapFilter());
console.log(findCheapToys_Reduce());

console.log(findCheapToys_Reduce([{name: "a", releaseYear: 2010, price: 19}, {name: "b", releaseYear: 2011, price: 27}]));
