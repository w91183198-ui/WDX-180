<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Backgrounds and Borders: Task 1</title>
    <style>
      body {
        background-color: #fff;
        color: #333;
        font: 1.2em / 1.5 Helvetica Neue, Helvetica, Arial, sans-serif;
        padding: 1em;
        margin: 0;
      }

      * {
        box-sizing: border-box;
      }
      .box {
        width: 500px;
        padding: 0.5em;
      }
    </style>


    <style>
    /*
    
    Give the box a 5px black solid border, with rounded corners of 10px.
    Add a background image (use balloons.jpg) and size it so that it covers the box.
    Give the <h2> a semi-transparent black background color, and make the text white.

    */

    .box
    {
        border: 5px solid black;
        border-radius: 10px;
        background-image: url("balloons.jpg");
        background-size: cover;
    }

    h2{
        background-color: #1f1e1e33;
        color: white;
    }
    </style>
  </head>

  <body>

    <div class="box">
      <h2>Backgrounds &amp; Borders</h2>
    </div>

  </body>

</html
