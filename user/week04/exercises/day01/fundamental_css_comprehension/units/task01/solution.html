<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        font: 1.2em / 1.5 sans-serif;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li {
        margin: 1em;
        padding: 0.5em;
      }

      .hex {
        background-color: #86defa;
      }

      /* Add styles here */

      .rgb {
        background-color: rgb(132, 221, 254);
      }

      .hsl {
        background-color: hsl(196, 98%, 76%);
      }

      .transparency {
        background-color: rgba(132, 221, 254, 0.6);
      }
    </style>
  </head>
  <body>
    <ul>
      <li class="hex">hex color</li>
      <li class="rgb">RGB color</li>
      <li class="hsl">HSL color</li>
      <li class="transparency">Alpha value 0.6</li>
    </ul>
  </body>
</html>
