<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        main{
             width: 60vw;
            align-content: center;
            justify-content: center;
        }

        table{
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 1.3rem;
            width: 60vw;
        }

        th{
            background-color: rgb(46, 185, 240);
            color: whitesmoke;
        }

        thead > tr
        {
            border-top: 3px solid black;
            border-bottom: 3px solid black;
        }

        tbody > tr:nth-child(1)
        {
            background-color: rgb(207, 207, 207);
        }
        tbody > tr:nth-child(2)
        {
            border-bottom: 3px solid black;
        }

        td {
            padding: 0.4em;
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        span {
            color: red;
        }
    </style>
</head>
<body>
    <main>
        <h2>Defining Articles in Nominative and Dative Case</h2>
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>masculine</th>
                    <th>feminine</th>
                    <th>neutral</th>
                    <th>plural</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Nominative</th>
                    <td>der Mann</td>
                    <td>die Frau</td>
                    <td>das Kind</td>
                    <td>die Kinder</td>
                </tr>
                <tr>
                    <th>Dative</th>
                    <td>dem Mann</td>
                    <td>der Frau</td>
                    <td>dem Kind</td>
                    <td>den Kinder<span>n</span></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
